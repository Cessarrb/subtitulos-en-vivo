name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bajar el modelo de voz en inglés (Vosk)
        run: |
          curl -L --fail -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model-en-us
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us

      - name: Compilar
        run: gradle assembleDebug --stacktrace

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: SubtitulosEnVivo
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar en Releases (para bajarlo desde el celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SubtitulosEnVivo.apk
          gh release delete ultima -y --cleanup-tag || true
          gh release create ultima SubtitulosEnVivo.apk \
            --title "Última versión" \
            --notes "Bajá SubtitulosEnVivo.apk desde el celular e instalalo."
