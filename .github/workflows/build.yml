name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Compilar
        run: ./gradlew assembleDebug --stacktrace

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: SubtitulosEnVivo
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar en Releases (para bajarlo desde el celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SubtitulosEnVivo.apk
          gh release delete ultima -y --cleanup-tag || true
          gh release create ultima SubtitulosEnVivo.apk \
            --title "Última versión" \
            --notes "Bajá SubtitulosEnVivo.apk desde el celular e instalalo."
